services:
  postgres:
    image: postgres:16-alpine
    container_name: aegisvault-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aegisvault}
    networks:
      - aegis-internal
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-aegisvault}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: aegisvault-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    networks:
      - aegis-internal
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    container_name: aegisvault-prod-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEMO_MODE: "false"
      COOKIE_SECURE: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aegisvault}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      SECRET_KEY: ${SECRET_KEY}
    networks:
      - aegis-internal
      - aegis-gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
    container_name: aegisvault-prod-worker
    restart: unless-stopped
    command: ["celery", "-A", "apps.worker.celery_app", "worker", "--loglevel=info", "-c", "4"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aegisvault}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
    networks:
      - aegis-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    container_name: aegisvault-prod-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${DOMAIN_NAME:-aegisvault.example.com}/api/v1
    networks:
      - aegis-gateway
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 1G

  gateway:
    image: traefik:v3.0
    container_name: aegisvault-prod-gateway
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs_data:/certificates
    networks:
      - aegis-gateway

networks:
  aegis-internal:
    internal: true
  aegis-gateway:

volumes:
  postgres_prod_data:
  redis_prod_data:
  certs_data:
