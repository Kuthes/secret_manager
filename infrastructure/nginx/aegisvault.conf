# ==============================================================================
# AegisVault — Production Nginx Reverse Proxy Configuration
# ==============================================================================

upstream aegisvault_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream aegisvault_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name vault.example.com;

    # Redirect all HTTP traffic to HTTPS (uncomment when TLS is enabled)
    # return 301 https://$host$request_uri;

    client_max_body_size 50M;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. API & Swagger Documentation Endpoints
    location /api/ {
        proxy_pass http://aegisvault_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for streaming & live PAM terminal
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 2. Next.js Static Optimization Assets
    location /_next/static/ {
        proxy_pass http://aegisvault_web;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }

    # 3. Next.js Web Console UI
    location / {
        proxy_pass http://aegisvault_web;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Next.js HMR / live updates
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
