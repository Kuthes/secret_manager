services:
  postgres:
    image: postgres:16-alpine
    container_name: aegisvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegisvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegisvault_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-aegisvault}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegisvault} -d ${POSTGRES_DB:-aegisvault}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aegisvault-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: aegisvault-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP port

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    container_name: aegisvault-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DEMO_MODE: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aegisvault}:${POSTGRES_PASSWORD:-aegisvault_dev_pass}@postgres:5432/${POSTGRES_DB:-aegisvault}
      REDIS_URL: redis://redis:6379/0
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-TESTONLY_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      SECRET_KEY: ${SECRET_KEY:-TESTONLY_insecure_jwt_secret_key_for_development}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
    container_name: aegisvault-worker
    restart: unless-stopped
    command: ["celery", "-A", "apps.worker.celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aegisvault}:${POSTGRES_PASSWORD:-aegisvault_dev_pass}@postgres:5432/${POSTGRES_DB:-aegisvault}
      REDIS_URL: redis://redis:6379/0
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-TESTONLY_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
    container_name: aegisvault-scheduler
    restart: unless-stopped
    command: ["celery", "-A", "apps.worker.celery_app", "beat", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aegisvault}:${POSTGRES_PASSWORD:-aegisvault_dev_pass}@postgres:5432/${POSTGRES_DB:-aegisvault}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    container_name: aegisvault-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
